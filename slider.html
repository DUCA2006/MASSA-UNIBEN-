<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Slider Test</title>
  <style>
    /* Reset & Page Background */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* SLIDER CONTAINER */
    .hero-slider-box {
      position: relative;
      width: 100%;
      max-width: 450px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
      background-color: #000;
    }

    .slider-wrapper {
      position: relative;
      width: 100%;
      height: 260px;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* CAPTION BADGE */
    .slide-caption {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(5px);
    }

    /* NAVIGATION DOTS */
    .slider-dots {
      position: absolute;
      bottom: 14px;
      right: 14px;
      display: flex;
      gap: 6px;
      z-index: 5;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dot.active {
      background-color: #ffffff;
      width: 20px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<!-- HERO SLIDER BOX -->
<div class="hero-slider-box">
  <div class="slider-wrapper">
    
    <!-- Slide 1: Iyayi Hall -->
    <div class="slide active">
      <img src="iyayi-hall.jpg" alt="Iyayi Hall">
      <div class="slide-caption">1. Iyayi Hall</div>
    </div>

    <!-- Slide 2: Atewe Hall -->
    <div class="slide">
      <img src="atewe-hall.jpg" alt="Atewe Hall">
      <div class="slide-caption">2. Atewe Hall</div>
    </div>

  </div>

  <!-- Indicator Dots (Only 2 dots now) -->
  <div class="slider-dots">
    <span class="dot active" onclick="currentSlide(0)"></span>
    <span class="dot" onclick="currentSlide(1)"></span>
  </div>
</div>

    <!-- Indicator Dots -->
    <div class="slider-dots">
      <span class="dot active" onclick="currentSlide(0)"></span>
      <span class="dot" onclick="currentSlide(1)"></span>
      <span class="dot" onclick="currentSlide(2)"></span>
    </div>
  </div>

  <script>
    let slideIndex = 0;
    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');

    function showSlide(index) {
      slides.forEach(slide => slide.classList.remove('active'));
      dots.forEach(dot => dot.classList.remove('active'));

      slideIndex = index;
      if (slideIndex >= slides.length) slideIndex = 0;
      if (slideIndex < 0) slideIndex = slides.length - 1;

      slides[slideIndex].classList.add('active');
      dots[slideIndex].classList.add('active');
    }

    function currentSlide(index) {
      showSlide(index);
    }

    // Auto-swap picture every 3 seconds
    setInterval(() => {
      showSlide(slideIndex + 1);
    }, 3000);
  </script>

</body>
</html>
